services:
  ocr-service:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ocr-service
    image: ghcr.io/projeto-1-corretor-prova/ocr-service:latest
    env_file: .env
    ports:
      - $PORT:8000
  
  redis:
    image: redis
    command: redis-server --requirepass $REDIS_PASSWORD
    ports:
      - "$REDIS_PORT:6379"

  minio:
    image: minio/minio
    container_name: minio
    env_file: .env
    command: [ "server", "--console-address", ":9001", "/data" ]
    volumes:
      - minio_data:/data
    ports:
      - "$MINIO_CONSOLE_PORT:9000"
      - "$MINIO_WEBUI_PORT:9001"

volumes:
  minio_data:
    driver: local
